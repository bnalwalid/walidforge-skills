description = "Measure the browser bottleneck and verify the improvement"

prompt = """
Invoke performance-optimization alongside browser-testing-with-devtools skills.

Task arguments: {{args}}

Identify the user-facing browser metric, target interaction, workload and available isolated runtime. Establish a baseline before changing the application. If browser tooling is unavailable, disclose that limit and provide the next measurement step.

Profile the representative path, choose a fix supported by the measured bottleneck and compare equivalent before/after conditions. Verify correctness and relevant interaction/accessibility alongside the improvement.

Deliver the baseline, cause, changed behavior, comparison and regression guard. Do not claim a Lighthouse score or local timing proves production performance.
"""
